<!DOCTYPE html>
<html lang="en">
<head>
    <style>

        html, body {
            height: 100%;
            margin: 0px;
            background-color: white;
        }

        .grid-container {

            display: grid;
            grid-template-columns: 25% 75%;
            grid-template-rows: auto 1fr;
            background-color: rgb(255, 255, 255) ;
            box-sizing: border-box;
            min-height: 100vh;
        }

        header {
            grid-row: 1 / 2;
            grid-column: 1/3;
            background-color: white;
            color: black ; text-align: center; 
        }


        aside {
            grid-row: 2/3 ;
            grid-column: 1 / 2;
            background-color: rgb(0, 136, 255);
            color: white;
            text-align: left;
            padding: 30px;
        }
        
        main {
            grid-row: 2/3 ;
            grid-column: 2/3;
            background-color: #f0f0f0;
            color: black;
            text-align: left;
            padding: 30px;
        }

        @media (max-width:600px) {

            .grid-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
            }
            
            header {
                grid-column: 1/2;
                grid-row: 1/2;
            }

            aside {
                grid-column: 1/2;
                grid-row: 2/3;
            }

            main {
                grid-column: 1/2;
                grid-row: 3/4;
            }
        }
        
    </style>
</head>
<body>
    
    <div class="grid-container">
    <header>
     <h1 align ="center">โจทย์ที่ 2: 2-Column Layout ด้วย CSS Grid</h1>
    </header>

    <aside>
        <h1><strong>เมนู</strong></h1>
        <p>About</p>
        <p>Services</p>
        <p>Contact</p>
    </aside>

    <main>

        <h1><strong>ยินดีต้อนรับ</strong></h1>
        <p>นี่คือเนื้อหาหลักของเว็ปไซต์</p>
        <p>ลองทดสอบย่อ-ขยายหน้าจอเพื่อดู Responsive Layout</p>

    </main>

    </div>


    
</body>
</html>
