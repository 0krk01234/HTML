<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grade-check</title>
</head>
<body>

<pre id="outputBox">Run code</pre>
<button onclick="runResult()">Runcode</button>
<script>
    function runResult() {

        const output = [];

        let score = Math.floor(Math.random() * 100) + 1;
        output.push("คะแนนที่สุ่มได้: " + score);
        console.log("คะแนนที่สุ่มได้:", score);

        if (score >= 80){

            output.push("เกรด: A");
            console.log("เกรด: A"); 

            output.push("ผลสอบ: ผ่าน");
            console.log("ผลสอบ: ผ่าน");

        }else if ( score >= 70){

            output.push("เกรด: B");
            console.log("เกรด: B"); 

            output.push("ผลสอบ: ผ่าน");
            console.log("ผลสอบ: ผ่าน");

        }else if ( score >= 60){

            output.push("เกรด: C");
            console.log("เกรด: C"); 

            output.push("ผลสอบ: ผ่าน");
            console.log("ผลสอบ: ผ่าน");

        }else if ( score >= 50){

            output.push("เกรด: D");
            console.log("เกรด: D"); 

            output.push("ผลสอบ: ผ่าน");
            console.log("ผลสอบ: ผ่าน");

        }else{
            output.push("เกรด: F");
            console.log("เกรด: F");   

            output.push("ผลสอบ: ไม่ผ่าน");
            console.log("ผลสอบ: ไม่ผ่าน");
            
        }
        



        document.getElementById("outputBox").textContent = output.join("\n");
    }
</script>    
    
</body>
</html>
