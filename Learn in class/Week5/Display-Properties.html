<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .block-example div {
            display: block;
            padding: 10px;
            margin-bottom: 5px;
            background: #c8e6ff;
        }

        .inline-example span {
            display: inline;
            padding: 5px;
            background: #ffc8c8;
            margin-right: 5px;
        }

        .inline-block-example div {
            display: inline-block;
            width: 120px;
            height: 40px;
            background: #d2ffd2;
            margin-right: 10px;
            text-align: center;
            line-height: 40px;
            border: 1px solid #4caf50;
        }
    </style>
</head>
<body>

    <h1>Display Block</h1>
    <h5>กินพื้นที่เต็มบรรทัด และขึ้นบรรทัดใหม่เสมอ</h5>

    <div class="block-example">
        <div>Block1</div>
        <div>Block2</div>

    </div>

    <h1>Display Inline</h1>
    <h5>อยู่ในบรรทัดเดียวกันและไม่สามารถกำหนด height/width ได้</h5>

    <div class="inline-example span">
        <span>inline1</span>
        <span>inline2 inline2</span>

    </div>

    <h1>Display inline block</h1>
    <h5>รวมข้อดีของ inline/block และสามารถกำหนด width และ height ได้</h5>

    <div class="inline-block-example">
        <div>Box A</div>
        <div>Box B Box B</div>
        <div>Box C</div>

    </div>
    

    

</body>
</html>
