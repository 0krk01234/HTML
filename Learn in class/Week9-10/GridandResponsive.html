<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid and Responsive</title>

    <style>
        /*grid contrainer มือถือก่อนหรือมือถือเป็นหลัก*/

        .grid-contrainer {

            display: grid;
            grid-template-columns: 1fr; /*มือถือ: 1 คอลัมน์*/
            gap: 15px;
            background: #e9edf2;
            padding: 5px;
            border-radius:10px;
        }

        /*กล่องเนื้อหา*/
        .item {
            background: #0f2557;
            color: #ffffff;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border-radius: 8px;
        }

        /*แท็บเล็ตขึ้นไป*/

        @media (min-width: 768px) {
            .grid-contrainer {
                grid-template-columns: repeat(2,1fr); /* 2 คอลัมน์ */
            }
        }

        /*computer ขึ้นไป */ 
        
        @media(min-width: 1024px) {
            .grid-contrainer{
                grid-template-columns: repeat(4,1fr); /*4 คอลัมน์ */
                max-width: 1200px;
                margin: 0 auto ; /*จัดกลางหน้าจอ*/
            }
        }
    </style>
</head>
<body>

    <h1 align="center">Grid Responsive</h1>

    <div class="grid-contrainer">
        <div class="item">Iten1</div>
        <div class="item">Iten2</div>
        <div class="item">Iten3</div>
        <div class="item">Iten4</div>
        <div class="item">Iten5</div>
        <div class="item">Iten6</div>
        <div class="item">Iten7</div>
        <div class="item">Iten8 </div>
    </div>
    
</body>
</html>
